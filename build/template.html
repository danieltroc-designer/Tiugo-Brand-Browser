<style>
/*__FONT_FACES__*/
@property --accent{syntax:'<color>';inherits:true;initial-value:#FF5A00}
@property --accent-2{syntax:'<color>';inherits:true;initial-value:#121212}

/* ================= tokens ================= */
:root{
  /* color roles (light); body.theme-dark overrides */
  --paper:#FAFAF8; --card:#FFFFFF; --line:#E7E6E1;
  --ink:#16161A; --ink-2:#5B5B63; --ink-3:#8E8E96;
  --accent:#FF5A00; --accent-2:#121212; --on-accent:#FFFFFF;
  --danger:#C0392B; --pass:#687D46; --fail:#EB480F;

  /* type */
  --mono:'JetBrains Mono',monospace; --disp:'Aspekta',system-ui,sans-serif; --body:'Aspekta',system-ui,sans-serif;
  --text-micro:11px; --text-caption:12px; --text-footnote:13px; --text-subhead:14px;
  --text-body:15px; --text-callout:17px; --text-title3:20px; --text-title2:24px;
  --text-title1:28px; --text-large:32px; --text-display:clamp(40px,6vw,64px);
  --track-display:-.035em; --track-title:-.025em; --track-head:-.015em;
  --lh-tight:1.15; --lh-snug:1.35; --lh-body:1.6;

  /* spacing: --sp-N = N × 4px */
  --sp-0h:2px; --sp-1:4px; --sp-1h:6px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:28px; --sp-8:32px; --sp-9:36px; --sp-10:40px; --sp-12:48px; --sp-14:56px;
  --sp-18:72px; --sp-20:80px; --sp-22:88px; --sp-24:96px; --sp-26:104px; --sp-32:128px;
  --section-gap:var(--sp-26); --grid-gap:var(--sp-6); --grid-gap-sm:var(--sp-4); --card-pad:var(--sp-7);

  /* shape */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;

  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1);
  --dur-press:.1s; --dur-fast:.2s; --dur-move:.35s; --dur-theme:.45s;

  /* elevation & materials */
  --shadow-1:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --shadow-2:0 10px 30px rgba(0,0,0,.18);
  --blur:blur(20px) saturate(180%);
}
body{--line-strong:color-mix(in srgb,var(--ink) 22%,var(--line));--material:color-mix(in srgb,var(--card) 78%,transparent)}
body.theme-dark{--ink:#F4F4F2;--ink-2:#A7A7A7;--ink-3:#6F6F6F;--paper:#090909;--card:#111111;--line:#242424;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}

/* ================= base ================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:var(--text-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;
  transition:background-color var(--dur-theme) var(--ease),color var(--dur-theme) var(--ease),--accent var(--dur-theme) var(--ease),--accent-2 var(--dur-theme) var(--ease)}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r-xs)}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.i{width:16px;height:16px;flex:none;stroke-width:1.75}

/* press feedback lands on pointer-down */
.btn,.brand-btn,.swatch,.claim,.pair,.role-item,.ibtn,.toc button,.gate-btn,.seg button{
  transition:transform var(--dur-press) ease-out,background-color var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast)}
.btn:active,.brand-btn:active,.claim:active,.ibtn:active,.toc button:active,.gate-btn:active,.seg button:active{transform:scale(.97)}
.swatch:active,.pair:active,.role-item:active{transform:scale(.98)}

/* ================= layout ================= */
.app{display:grid;grid-template-columns:280px 216px minmax(0,1fr);min-height:100vh}
.app>*{min-width:0}

/* sidebar */
.side{border-right:1px solid var(--line);padding:var(--sp-9) var(--sp-6) var(--sp-7);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:var(--sp-8);background:var(--paper);transition:background-color var(--dur-theme) var(--ease),border-color var(--dur-theme) var(--ease)}
.masthead h1{font-family:var(--disp);font-weight:700;font-size:var(--text-title3);letter-spacing:var(--track-head);line-height:1.2;padding-left:var(--sp-3)}
.brand-list{display:flex;flex-direction:column;gap:var(--sp-1)}
.brand-btn{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-lg);text-align:left;border:1px solid transparent;width:100%}
.brand-btn.active{background:var(--card);border-color:var(--line);box-shadow:var(--shadow-1)}
.brand-btn .dot{width:28px;height:28px;border-radius:var(--r-sm);flex:none;position:relative;overflow:hidden}
.brand-btn .dot::before,.brand-btn .dot::after{content:"";position:absolute;inset:0}
.brand-btn .dot::before{background:var(--c1)}
.brand-btn .dot::after{background:var(--c2);clip-path:polygon(100% 0,100% 100%,0 100%)}
.brand-btn .glyph{width:28px;height:28px;flex:none;display:block}
.brand-btn .glyph svg{display:block;width:100%;height:100%}
.brand-btn .glyph .g-dark,body.theme-dark .brand-btn .glyph .g-light{display:none}
body.theme-dark .brand-btn .glyph .g-dark{display:block}
.brand-btn .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand-btn .nm{font-weight:600;font-size:var(--text-subhead);line-height:1.2}
.brand-btn .dm{font-size:var(--text-caption);color:var(--ink-3);line-height:1.2}
.brand-btn.soon{opacity:.45;cursor:not-allowed}
.side-foot{margin-top:auto;padding-left:var(--sp-3);font-size:var(--text-caption);color:var(--ink-3);line-height:var(--lh-body)}
.side-foot a{color:var(--ink-2)}

/* on-this-page menu */
.toc{position:relative;display:flex;flex-direction:column}
.toc .ind{position:absolute;top:0;height:0;pointer-events:none;transition:transform var(--dur-move) var(--ease),height var(--dur-move) var(--ease)}
.toc button{position:relative;text-align:left;font-size:var(--text-footnote);line-height:var(--lh-snug);color:var(--ink-2)}
.toc button[aria-current="true"]{color:var(--ink);font-weight:500}
.toc-inline{display:none;margin:var(--sp-1h) 0 var(--sp-3) 26px;padding-left:var(--sp-4);border-left:1px solid var(--line)}
.toc-inline .ind{left:-1px;width:2px;border-radius:2px;background:var(--accent)}
.toc-inline button{padding:var(--sp-1h) 0}
.toc-rail{padding:var(--sp-9) 0 var(--sp-9) var(--sp-4)}
.toc-float{position:sticky;top:var(--sp-9);padding:var(--sp-2);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--material);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow-1)}
.toc-float .ind{left:var(--sp-2);right:var(--sp-2);border-radius:var(--r-md);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.toc-float button{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md)}

/* main */
main{padding:0 clamp(var(--sp-6),6vw,var(--sp-22)) var(--sp-32);width:100%;max-width:1240px;margin-inline:auto}
main.enter{animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
section{margin-bottom:var(--section-gap);scroll-margin-top:var(--sp-10)}

/* ================= components ================= */
/* hero */
.hero{padding:var(--sp-22) 0 var(--sp-14);border-bottom:1px solid var(--line);margin-bottom:var(--sp-18)}
.hero h2{font-family:var(--disp);font-weight:700;font-size:var(--text-display);letter-spacing:var(--track-display);line-height:1.02;margin-bottom:var(--sp-4)}
.hero p{color:var(--ink-2);font-size:var(--text-callout);line-height:1.55;max-width:58ch}
.hero .meta{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1h) var(--sp-6);margin-top:var(--sp-7);font-size:var(--text-footnote);color:var(--ink-3)}
.hero .meta a{display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--ink);font-weight:500;text-decoration:none}
.hero .meta a .i,.flink .i{width:14px;height:14px}

/* notice + segmented control */
.notice{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-7);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:var(--r-lg);font-size:var(--text-footnote);line-height:1.5}
.notice .i{color:var(--accent)}
.seg{display:inline-flex;gap:var(--sp-0h);padding:3px;border-radius:var(--r-md);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.seg button{padding:var(--sp-1h) var(--sp-4);border-radius:var(--r-sm);font-size:var(--text-footnote);font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.verbar{margin-top:var(--sp-7)}
.soon-panel{border:1px dashed var(--line);border-radius:var(--r-lg);background:var(--card);padding:var(--sp-20) var(--sp-8);text-align:center}
.soon-panel .tag{display:block;font-size:var(--text-footnote);color:var(--ink-3);margin-bottom:var(--sp-3)}
.soon-panel h3{font-family:var(--disp);font-weight:700;font-size:var(--text-title1);letter-spacing:var(--track-title);margin-bottom:var(--sp-3)}
.soon-panel p{color:var(--ink-2);max-width:46ch;margin:0 auto}

/* section header */
.sec-h{display:flex;align-items:baseline;gap:var(--sp-3) var(--sp-5);margin-bottom:var(--sp-7);flex-wrap:wrap}
.sec-h h3{font-family:var(--disp);font-weight:600;font-size:var(--text-title1);letter-spacing:var(--track-title);line-height:var(--lh-tight)}
.sec-h h3:focus{outline:none}
.sec-h .hint{font-size:var(--text-footnote);color:var(--ink-3)}
.sec-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;margin-left:auto}
.sub-h{font-family:var(--disp);font-size:var(--text-title3);font-weight:600;letter-spacing:var(--track-head);line-height:1.3;margin:var(--sp-18) 0 var(--sp-5)}
.sub-h+.sub-note{margin-top:calc(var(--sp-3) * -1)}
.sub-note{font-size:var(--text-subhead);color:var(--ink-2);max-width:72ch;margin:0 0 var(--sp-6);line-height:var(--lh-body)}
.sub-note:empty{display:none}
.row{display:flex;gap:var(--sp-2);flex-wrap:wrap}

/* button */
.btn{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-size:var(--text-footnote);font-weight:500;line-height:1.2;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn .i{width:15px;height:15px}

/* card (shared surface) */
.logo-card,.icon-card,.swatch,.font-card,.type-table,.rule,.about-card,.spec-card,.dont,.media-card,.icon-sys,.export-box{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card)}

/* logos & asset files */
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--grid-gap)}
.logo-card{overflow:hidden;display:flex;flex-direction:column}
.logo-stage{display:grid;place-items:center;min-height:200px;padding:var(--sp-10)}
.logo-stage.light{background:#fff}
.logo-stage.dark{background:#0B0B0B}
.logo-stage svg,.logo-stage img{max-width:min(240px,80%);max-height:96px;width:auto;height:auto}
.logo-meta{padding:var(--sp-5);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--sp-3);flex:1}
.logo-meta .lbl{font-weight:600;font-size:var(--text-body);line-height:var(--lh-snug)}
.logo-meta .nt{font-size:var(--text-footnote);color:var(--ink-2);line-height:1.55;flex:1}
.logo-meta .row{margin-top:var(--sp-1)}
.ftags{display:flex;gap:var(--sp-1) var(--sp-4);flex-wrap:wrap}
.ftag{font-family:var(--mono);font-size:var(--text-micro);color:var(--ink-3);white-space:nowrap}
.logo-grid.compact{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--grid-gap-sm)}
.logo-grid.compact .logo-stage{min-height:128px;padding:var(--sp-7)}
.logo-grid.compact .logo-stage svg{max-height:56px;width:56px;height:56px}
.logo-grid.compact .logo-meta{padding:var(--sp-4);gap:var(--sp-3)}
.logo-grid.compact .lbl{font-size:var(--text-footnote)}
.logo-grid.compact .nt{display:none}
.logo-grid.compact .btn{padding:var(--sp-1h) var(--sp-3);font-size:var(--text-caption)}

/* icons */
.icon-search{width:100%;max-width:360px;margin-bottom:var(--sp-5);padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--ink);font:inherit;font-size:var(--text-subhead);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.icon-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.icon-search::placeholder{color:var(--ink-3)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:var(--sp-3)}
.icon-card{padding:var(--sp-4) var(--sp-3);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);text-align:center;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.icon-tile{display:grid;place-items:center;height:56px;width:100%;color:var(--ink)}
.icon-tile svg,.icon-tile img{width:auto;height:auto;max-width:34px;max-height:34px}
.icon-cap{font-size:var(--text-caption);color:var(--ink-2);line-height:1.3;word-break:break-word;min-height:1.3em}
.icon-acts{display:flex;gap:var(--sp-1h)}
.ibtn{padding:var(--sp-1) var(--sp-3);border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--text-caption);color:var(--ink-2);background:var(--paper)}
.icon-none{font-size:var(--text-subhead);color:var(--ink-3);margin-top:var(--sp-4)}
.icon-sys{padding:var(--card-pad);display:flex;gap:var(--sp-6);align-items:flex-start;flex-wrap:wrap}
.icon-sys .ic{flex:none;display:flex;gap:var(--sp-3);color:var(--ink)}
.icon-sys .ic .i{width:24px;height:24px;stroke-width:1.5}
.icon-sys p{flex:1;min-width:240px;font-size:var(--text-subhead);color:var(--ink-2)}

/* colors */
.cgroup{margin-bottom:var(--sp-12)}
.cgroup:last-of-type{margin-bottom:0}
.cgroup .gname{font-size:var(--text-callout);font-weight:600;letter-spacing:var(--track-head);margin-bottom:var(--sp-4)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--grid-gap-sm)}
.swatch{overflow:hidden;text-align:left}
.swatch .fill{display:block;height:88px}
.swatch .info{display:block;padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.swatch .cn{font-size:var(--text-footnote);font-weight:600;line-height:1.3}
.swatch .cv{font-family:var(--mono);font-size:var(--text-micro);color:var(--ink-2);margin-top:var(--sp-1)}

/* color roles, usage, text pairs */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--grid-gap)}
.role-demo{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.role-demo .stage{padding:var(--card-pad);background:var(--bg)}
.role-demo .eb{font-family:var(--mono);font-size:10px;color:var(--sec)}
.role-demo .tt{font-size:var(--text-body);line-height:1.4;color:var(--tx);margin:var(--sp-1h) 0 var(--sp-4);max-width:44ch}
.role-demo .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.role-demo .cd{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-sm);padding:var(--sp-3);font-size:10.5px;line-height:1.4;color:var(--sec)}
.role-demo .act{display:inline-block;margin-top:var(--sp-4);background:var(--ac);color:#fff;font-size:var(--text-micro);padding:var(--sp-1h) var(--sp-3);border-radius:var(--r-xs)}
.role-list{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.role-item{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4);background:var(--card);text-align:left;font-size:var(--text-footnote);line-height:var(--lh-snug)}
.role-item .s{flex:none;width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.role-item .t{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:block}
.usage{display:grid;gap:var(--sp-6)}
.usage>div{min-width:0}
.usage .mode{font-size:var(--text-footnote);font-weight:500;color:var(--ink-2);margin-bottom:var(--sp-3)}
.ubar{display:flex;gap:var(--sp-1);height:96px}
.useg{border-radius:var(--r-md);padding:var(--sp-3);display:flex;flex-direction:column;justify-content:space-between;font-size:var(--text-micro);min-width:0;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.useg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.useg.spec{flex:0 0 14px;padding:0}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--sp-3)}
.pair{border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-4) var(--sp-4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);text-align:left}
.pair .aa{font-size:var(--text-large);line-height:1;font-weight:400}
.pair .pl{font-size:var(--text-micro);line-height:1.4;margin-top:var(--sp-5);font-family:var(--mono)}

/* typography */
.font-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--grid-gap);margin-bottom:var(--sp-8)}
.font-card{padding:var(--card-pad)}
.font-card .fam{font-size:var(--text-large);line-height:var(--lh-tight)}
.font-card .smp{font-size:22px;line-height:1.3;margin-top:var(--sp-4)}
.font-card .frole{font-size:var(--text-subhead);color:var(--ink-2);margin-top:var(--sp-5);line-height:1.5}
.font-card .fsrc{font-size:var(--text-footnote);color:var(--ink-3);margin-top:var(--sp-1)}
.font-card .flink{display:inline-flex;align-items:center;gap:var(--sp-1);margin-top:var(--sp-4);font-size:var(--text-footnote);font-weight:500;color:var(--ink);text-decoration:none}
.font-card .sub-tag{display:block;font-size:var(--text-caption);color:var(--ink-3);margin-bottom:var(--sp-3)}
.type-table{overflow:hidden}
.trow{display:grid;grid-template-columns:1fr auto;gap:var(--sp-6);align-items:center;padding:var(--sp-5) var(--sp-6);border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .spec{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .props{font-family:var(--mono);font-size:var(--text-micro);color:var(--ink-3);text-align:right;line-height:1.7;flex:none}
.trow .props b{color:var(--ink-2);font-weight:500}
.trow .props .nm{color:var(--ink-3)}

/* guidelines */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--grid-gap-sm)}
.rule{padding:var(--sp-6);font-size:var(--text-subhead);color:var(--ink-2)}
.rule .topic{display:block;font-size:var(--text-body);font-weight:600;letter-spacing:var(--track-head);color:var(--ink);margin-bottom:var(--sp-1h)}

/* about */
.about{display:flex;flex-wrap:wrap;gap:var(--grid-gap);margin-bottom:var(--section-gap)}
.about-card{flex:1 1 280px;padding:var(--card-pad)}
.about-card .k{font-size:var(--text-footnote);font-weight:500;color:var(--ink-3)}
.about-card p{margin-top:var(--sp-3);font-size:18px;line-height:1.45;letter-spacing:-.01em}
.claims{display:flex;flex-wrap:wrap;gap:var(--sp-3);flex-basis:100%}
.claim{border:1px solid var(--line);border-radius:var(--r-pill);padding:var(--sp-2) var(--sp-4);font-size:var(--text-subhead);background:var(--card)}

/* logo specs, contrast, don'ts */
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--grid-gap-sm)}
.spec-card{padding:var(--sp-6)}
.spec-card .k{font-size:var(--text-footnote);font-weight:500;color:var(--ink-3)}
.spec-card .v{font-family:var(--disp);font-weight:600;font-size:var(--text-title2);letter-spacing:var(--track-title);line-height:1.2;margin:var(--sp-1h) 0 var(--sp-2)}
.spec-card .n{font-size:var(--text-footnote);color:var(--ink-2);line-height:1.55}
.contrast{display:grid;grid-template-columns:auto repeat(var(--cols),minmax(76px,1fr));padding-bottom:var(--sp-1);gap:var(--sp-3);align-items:stretch;overflow-x:auto}
.contrast .rl{font-size:var(--text-caption);color:var(--ink-3);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;align-self:center}
.contrast .cl{font-size:var(--text-caption);color:var(--ink-3);text-align:center;line-height:1.3}
.ctile{position:relative;aspect-ratio:1.15;width:100%;min-width:0;align-self:start;overflow:hidden;border-radius:var(--r-md);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.ctile img{width:58%;height:auto}
.ctile .r{position:absolute;left:var(--sp-2);bottom:var(--sp-1h);font-family:var(--mono);font-size:10.5px;opacity:.75}
.ctile .ok{position:absolute;top:var(--sp-2);right:var(--sp-2);width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ctile .ok .i,.dont .x .i{width:10px;height:10px;stroke-width:3}
.ctile.pass .ok{background:var(--pass)}.ctile.fail .ok{background:var(--fail)}
.ctile.fail img{opacity:.9}
.ctile.pref{box-shadow:0 0 0 2px var(--accent)}
.donts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp-3)}
.dont{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-4);font-size:var(--text-footnote);color:var(--ink-2);line-height:1.45}
.dont .x{flex:none;width:18px;height:18px;border-radius:50%;background:var(--fail);color:#fff;display:grid;place-items:center}

/* media */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--grid-gap)}
.media-card{overflow:hidden;display:flex;flex-direction:column}
.media-card .pv{display:block;background:#0B0B0B;aspect-ratio:var(--ratio,16/9);overflow:hidden}
.media-card .pv.light{background:#F7F7F4}
.media-card .pv img{display:block;width:100%;height:100%;object-fit:contain}
.media-card .mm{padding:var(--sp-4) var(--sp-5) var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);border-top:1px solid var(--line)}
.media-card .lbl{font-weight:600;font-size:var(--text-subhead);letter-spacing:-.01em}

/* export */
.export-box{padding:var(--card-pad);display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
.export-box p{flex-basis:100%;color:var(--ink-2);margin-bottom:var(--sp-2)}

/* toast: a translucent material floating over content */
.toast{position:fixed;bottom:var(--sp-7);left:50%;transform:translate(-50%,16px) scale(.96);background:color-mix(in srgb,var(--ink) 80%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--paper);font-size:var(--text-footnote);font-weight:500;padding:var(--sp-3) var(--sp-5);border-radius:var(--r-pill);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform var(--dur-move) var(--ease);z-index:50;max-width:82vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* login gate */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:var(--sp-6);background:var(--paper)}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:var(--sp-5);border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);padding:var(--sp-9) var(--sp-8);box-shadow:var(--shadow-1)}
.gate-card h1{font-family:var(--disp);font-weight:700;font-size:var(--text-title2);letter-spacing:var(--track-title);line-height:var(--lh-tight)}
.gate-sub{font-size:var(--text-subhead);color:var(--ink-2);margin-top:calc(var(--sp-3) * -1);line-height:1.5}
.gate-field{display:flex;flex-direction:column;gap:var(--sp-2)}
.gate-field span{font-size:var(--text-footnote);font-weight:500;color:var(--ink-2)}
.gate-field input{padding:var(--sp-3) var(--sp-4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);font:inherit;font-size:var(--text-body);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.gate-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.gate-err{font-size:var(--text-footnote);color:var(--danger);margin-top:calc(var(--sp-1h) * -1)}
.gate-btn{margin-top:var(--sp-1h);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--ink);color:var(--paper);font-weight:600;font-size:var(--text-body)}
.gate-shake{animation:gate-shake .4s}
@keyframes gate-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

/* ================= states ================= */
/* hover only where a pointer can hover */
@media (hover:hover){
  .brand-btn:not(.soon):not(.active):hover{background:color-mix(in srgb,var(--card) 70%,transparent)}
  .toc button:hover{color:var(--ink)}
  .toc-float button:not([aria-current="true"]):hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
  .hero .meta a:hover,.font-card .flink:hover{color:var(--accent)}
  .btn:hover,.ibtn:hover,.claim:hover{border-color:var(--line-strong)}
  .ibtn:hover{color:var(--ink)}
  .btn.primary:hover{border-color:var(--accent);filter:brightness(1.06)}
  .icon-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
  .swatch:hover{box-shadow:var(--shadow-1)}
  .seg button:not(.on):hover{color:var(--ink)}
  .gate-btn:hover{opacity:.9}
}

/* ================= responsive ================= */
@media (min-width:1100px){
  main{padding-left:clamp(var(--sp-6),3vw,var(--sp-12))}
}
@media (max-width:1099px){
  .app{grid-template-columns:280px minmax(0,1fr)}
  .toc-rail{display:none}
  .toc-inline{display:flex}
}
@media (max-width:840px){
  :root{--section-gap:var(--sp-20)}
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:var(--sp-5) var(--sp-5) var(--sp-4);gap:var(--sp-4);border-right:none;border-bottom:1px solid var(--line)}
  .masthead h1{padding-left:0}
  .brand-list{flex-direction:row;overflow-x:auto;padding-bottom:var(--sp-1);scrollbar-width:none}
  .brand-btn{flex:none;width:auto}
  .brand-btn .dm{display:none}
  .toc,.side-foot{display:none}
  main{padding-bottom:var(--sp-24)}
  .hero{padding:var(--sp-10) 0 var(--sp-9);margin-bottom:var(--sp-14)}
  .hero p{font-size:16px}
  .sec-h h3{font-size:var(--text-title2)}
  .sub-h{margin-top:var(--sp-14)}
  .role-list{grid-template-columns:repeat(2,1fr)}
  .useg{font-size:9.5px;padding:var(--sp-1h)}
  .useg.spec{flex-basis:8px}
}

/* ================= accessibility ================= */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-property:opacity,background-color,border-color,color!important}
  main.enter{animation:fade .2s!important}
  :active{transform:none!important}
}
@media (prefers-reduced-transparency: reduce){
  .toast{background:var(--ink);-webkit-backdrop-filter:none;backdrop-filter:none}
  .toc-float{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast: more){
  :root{--line:#B9B8B2;--ink-3:#5B5B63}
  body.theme-dark{--line:#5A5A5A;--ink-3:#A7A7A7}
  .toast{background:var(--ink)}
}

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  const cdSize=central.reduce((n,c)=>n+c.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,offset,true); eo.setUint16(20,0,true);
  return new Blob([...local,...central,new Uint8Array(eo.buffer)],{type:'application/zip'});
}

let fmt = 'hex';
let current = null;
let brandView = 'current';

/* ---------- sidebar ---------- */
/* The brand's own glyph file (light/dark stage), else its two-color tile. */
function glyphMark(b){
  const g = b.glyph || {}, light = g.light && findAsset(b, g.light), dark = g.dark && findAsset(b, g.dark);
  if(!(light && light.svg)) return '<span class="dot" aria-hidden="true"></span>';
  const d = dark && dark.svg ? dark : light;
  return `<span class="glyph" aria-hidden="true"><span class="g-light">${light.svg}</span><span class="g-dark">${d.svg}</span></span>`;
}
function renderSidebar(){

    return `<button class="brand-btn ${b.id===current?'active':''}${soon?' soon':''}" data-id="${b.id}"${soon?' disabled aria-disabled="true"':''} style="--c1:${b.accent};--c2:${b.accent2}">
      ${glyphMark(b)}
      <span class="txt"><span class="nm">${esc(b.name)}</span><span class="dm">${soon?'Coming soon':b.domain}</span></span>

/* ---------- on-this-page menu ----------
   Buttons, not #links: the URL hash selects the brand. */
let tocTargets = [];
/* Two copies, one visible per breakpoint: a floating rail beside the sidebar on
   wide screens, and an inline list under the active brand on medium ones. */
function renderToc(){
  document.querySelectorAll('.toc').forEach(n=>n.remove());
  const active = $('#brandList .brand-btn.active');
  tocTargets = [...$('#main').querySelectorAll('#overview, section[id]')];
  if(!active || tocTargets.length<2) return;
  const make = cls => {
    const nav = document.createElement('nav');
    nav.className = `toc ${cls}`; nav.setAttribute('aria-label','On this page');
    nav.innerHTML = '<span class="ind" aria-hidden="true"></span>' + tocTargets.map((el,i)=>
      `<button type="button" data-toc="${i}">${esc(el.id==='overview'?'Overview':el.querySelector('h3')?.textContent.trim()||el.id)}</button>`).join('');
    nav.querySelectorAll('[data-toc]').forEach(btn=>btn.addEventListener('click',()=>{
      const el = tocTargets[+btn.dataset.toc];
      el.scrollIntoView({block:'start'});
      const h = el.querySelector('h3,h2');
      if(h){ h.tabIndex=-1; h.focus({preventScroll:true}); }
    }));
    return nav;
  };
  $('#tocRail').append(make('toc-float'));
  active.after(make('toc-inline'));
  syncToc();
}
function syncToc(){
  if(!tocTargets.length) return;
  const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
  let idx = 0;
  if(atEnd) idx = tocTargets.length-1;
  else tocTargets.forEach((el,i)=>{ if(el.getBoundingClientRect().top <= 120) idx = i; });
  document.querySelectorAll('.toc').forEach(nav=>{
    const btns = nav.querySelectorAll('[data-toc]');
    btns.forEach((btn,i)=>btn.setAttribute('aria-current', i===idx?'true':'false'));
    const cur = btns[idx], ind = nav.querySelector('.ind');
    if(!cur || !ind || !cur.offsetHeight) return;
    const inset = nav.classList.contains('toc-float') ? 0 : 6;
    ind.style.height=`${cur.offsetHeight-inset*2}px`; ind.style.transform=`translateY(${cur.offsetTop+inset}px)`;
  });
}
let tocRaf = 0;
const queueSync = ()=>{ if(!tocRaf) tocRaf = requestAnimationFrame(()=>{ tocRaf=0; syncToc(); }); };
addEventListener('scroll', queueSync, {passive:true});
addEventListener('resize', queueSync);

/* ---------- sections ---------- */
/* Asset packs: named `assetPacks`, or the single legacy `assetFiles` list. */
function assetPacks(b){
  if(b.assetPacks) return b.assetPacks;
  return (b.assetFiles&&b.assetFiles.length)
    ? [{title:'Asset files', files:b.assetFiles, zipName:b.versions?`${b.id}-${brandView}-logos.zip`:`${b.id}-logos.zip`}]
    : [];
}
function findAsset(b, name){
  for(const p of assetPacks(b)){ const f=(p.files||[]).find(x=>x.name===name); if(f) return f; }
  return null;
}
/* A logo is either inline SVG or a reference to an embedded pack file (PNG-only until SVG exists). */
function logoSrc(b, l){
  const f = l.asset ? findAsset(b, l.asset) : null;
  return {svg: l.svg || (f&&f.svg) || null, png: f&&f.png || null, file: f};
}
function logoCard(b, l, i){

}

function colorHex(b, name){
  for(const g of b.colorGroups){ const c=g.colors.find(x=>x.name===name); if(c) return c.hex; }

function cssVars(b){

    lines.push(`  --${slug(b.id)}-${slug(g.group)}-${slug(c.name)}: ${c.hex.toUpperCase()};`)));
  primaryFonts(b).forEach((f,i)=>lines.push(`  --${slug(b.id)}-font-${i?'secondary':'primary'}: ${f.css};`));

    ...(b.colorRoles?{roles:Object.fromEntries(b.colorRoles.modes.map(m=>[m.name,Object.fromEntries(m.roles.map(r=>[r.role,{token:r.token,hex:r.hex.toUpperCase()}]))]))}:{}),

function brandMarkdown(b){
  const L=[];
  L.push(`# ${b.name}`, '');
  if(b.tagline) L.push(`> ${b.tagline}`, '');
  L.push(`- **Website:** https://${b.domain}`);
  L.push(`- **Accent:** \`${b.accent.toUpperCase()}\` / \`${b.accent2.toUpperCase()}\``);
  L.push(`- **Typefaces:** ${primaryFonts(b).map(f=>f.family).join(', ')}`, '');

  L.push('## Colors', '');
  b.colorGroups.forEach(g=>{
    const cm = g.colors.some(c=>c.cmyk);
    L.push(`### ${g.group}`, '');
    if(g.note) L.push(g.note, '');
    L.push(`| Name | HEX | RGB |${cm?' CMYK |':''}`, `| --- | --- | --- |${cm?' --- |':''}`);
    g.colors.forEach(c=>L.push(`| ${c.name} | \`${c.hex.toUpperCase()}\` | \`${rgbStr(c.hex)}\` |${cm?` \`${c.cmyk||'—'}\` |`:''}`));
    L.push('');
  });
  if(b.colorRoles){
    L.push('### Color roles', '', b.colorRoles.note||'', '', `| Role | ${b.colorRoles.modes.map(m=>m.name).join(' | ')} |`, `| --- |${b.colorRoles.modes.map(()=>' --- |').join('')}`);
    b.colorRoles.modes[0].roles.forEach((r,i)=>L.push(`| ${r.role} | ${b.colorRoles.modes.map(m=>`${m.roles[i].token} \`${m.roles[i].hex.toUpperCase()}\``).join(' | ')} |`));
    L.push('');
  }

  L.push('## Typography', '', '### Typefaces', '');
  b.fonts.forEach(f=>L.push(`- **${f.family}** — ${f.role} (${f.source}${f.url?`, ${f.url}`:''})`));
  L.push('', '### Type scale', '',
    '| Style | Family | Weight | Size | Line height | Letter spacing |',
    '| --- | --- | --- | --- | --- | --- |');
  b.typeStyles.forEach(t=>L.push(`| ${t.name} | ${t.family} | ${t.weight} | ${t.size}px | ${t.lh} | ${t.ls&&t.ls!=='0'?t.ls:'—'} |`));
  L.push('');

  if(b.logos&&b.logos.length){
    L.push('## Logos', '');
    b.logos.forEach(l=>L.push(`- **${l.label}**${l.note?` — ${l.note}`:''} _(stage: ${l.bg})_`));
    L.push('');
    (b.logoSpecs||[]).forEach(s=>L.push(`- **${s.label}:** ${s.value}${s.note?` — ${s.note}`:''}`));
    if(b.logoDonts&&b.logoDonts.length) L.push('', '### Incorrect usage', '', ...b.logoDonts.map(d=>`- ${d}`));
    L.push('');
  }
  if(b.icons&&b.icons.length){
    L.push('## Icons', '', `${b.icons.length} icons available. Names:`, '',
      b.icons.map(ic=>`\`${ic.name}\``).join(', '), '');
  }
  if(b.guidelines&&b.guidelines.length){
    L.push('## Usage guidelines', '');
    b.guidelines.forEach(r=>L.push(typeof r==='string' ? `- ${r}` : `- **${r.topic}:** ${r.text}`));
    L.push('');
  }
  L.push('---', '_Exported from the Tiugo Brand Browser._');
  return L.join('\n');
}

    :`
      <input type="search" class="icon-search" id="iconSearch" placeholder="Search ${b.icons.length} icon${b.icons.length===1?'':'s'}" aria-label="Search icons" autocomplete="off">
      <div class="icon-grid" id="iconGrid">${b.icons.map((ic,i)=>iconCard(ic,i)).join('')}</div>
      <p class="icon-none" id="iconNone" hidden>No icons match your search.</p>`}
  </section>` : ''}

  <section id="colors">
    <div class="sec-h">
      <h3>Colors</h3>
      <span class="hint">Click a swatch to copy its value</span>
      <div class="sec-actions">
        <span class="fmt-toggle seg" role="group" aria-label="Color format">
          <button data-fmt="hex" class="${fmt==='hex'?'on':''}">HEX</button>
          <button data-fmt="rgb" class="${fmt==='rgb'?'on':''}">RGB</button>
          ${hasCmyk?`<button data-fmt="cmyk" class="${fmt==='cmyk'?'on':''}">CMYK</button>`:''}
        </span>
      </div>
    </div>
    ${b.colorGroups.map(g=>`
      <div class="cgroup">
        <div class="gname">${esc(g.group)}</div>
        ${g.note?`<p class="sub-note">${esc(g.note)}</p>`:''}
        <div class="swatches">${g.colors.map(swatch).join('')}</div>
      </div>`).join('')}
    ${colorExtras(b)}
  </section>

  <section id="type">
    <div class="sec-h"><h3>Typography</h3></div>
    <div class="font-cards">
      ${b.fonts.map(f=>`<div class="font-card">
        ${f.substitute?`<span class="sub-tag">Substitute for ${esc(f.substitute)}</span>`:''}
        <div class="fam" style="font-family:${f.css}">${esc(f.family)}</div>
        ${f.sample?`<div class="smp" style="font-family:${f.css}">${esc(f.sample)}</div>`:''}
        <div class="frole">${esc(f.role)}</div>
        <div class="fsrc">${esc(f.source)}</div>
        ${f.url?`<a class="flink" href="${esc(f.url)}" target="_blank" rel="noopener">Get ${esc(f.family)}${EXT_ICON}</a>`:''}
      </div>`).join('')}
    </div>
    <div class="type-table">
      ${b.typeStyles.map(t=>{
        const px=Math.min(t.size,40);
        const w=parseInt(t.weight);
        return `<div class="trow">
          <div class="spec" style="font-family:${b.fonts.find(f=>f.family===t.family)?.css||t.family};font-weight:${w};font-size:${px}px;line-height:1.25;${t.upper?'text-transform:uppercase;':''}${t.ls&&t.ls!=='0'?`letter-spacing:${t.ls};`:''}">${esc(t.sample||t.name)}</div>
          <div class="props">${t.sample?`<span class="nm">${esc(t.name)}</span><br>`:''}<b>${esc(t.family)} · ${esc(t.weight)}</b><br>${t.size}px / ${esc(String(t.lh))}${t.ls&&t.ls!=='0'?` · ls ${esc(t.ls)}`:''}</div>
        </div>`;}).join('')}
    </div>
  </section>

  ${mediaSections(b)}

  ${b.guidelines?.length?`
  <section id="rules">
    <div class="sec-h"><h3>Usage guidelines</h3></div>
    <div class="rules">${b.guidelines.map(r=>typeof r==='string'
      ? `<div class="rule">${esc(r)}</div>`
      : `<div class="rule"><span class="topic">${esc(r.topic)}</span>${esc(r.text)}</div>`).join('')}</div>
  </section>`:''}

  <section id="export">
    <div class="sec-h"><h3>Export tokens</h3></div>
    <div class="export-box">
      <p>Colors and type styles for ${esc(b.name)}, as Markdown, CSS variables or JSON.</p>
      <button class="btn primary" data-act="mdcopy">Copy Markdown</button>
      <button class="btn" data-act="mddl">Download .md</button>
      <button class="btn" data-act="csscopy">Copy CSS variables</button>
      <button class="btn" data-act="jsoncopy">Copy JSON</button>
    </div>
  </section>`;

  $('#main').innerHTML = heroHtml + aboutHtml + sectionsHtml;
  renderToc();

  /* version toggle */
  $('#main').querySelectorAll('[data-ver]').forEach(el=>
    el.addEventListener('click',()=>{ brandView=el.dataset.ver; renderBrand(base); window.scrollTo({top:0}); }));

  /* wire events */
  $('#main').querySelectorAll('[data-copy]').forEach(el=>
    el.addEventListener('click',()=>copy(el.dataset.copy, `${el.dataset.copy} copied`)));
  $('#main').querySelectorAll('[data-fmt]').forEach(el=>
    el.addEventListener('click',()=>{ fmt=el.dataset.fmt; renderBrand(b); }));
  $('#main').querySelectorAll('[data-act="copysvg"]').forEach(el=>
    el.addEventListener('click',()=>copy(logoSrc(b,b.logos[+el.dataset.i]).svg,'SVG markup copied')));
  $('#main').querySelectorAll('[data-act="dlsvg"]').forEach(el=>
    el.addEventListener('click',()=>{ const l=b.logos[+el.dataset.i];
      dl(`${b.id}-${slug(l.label)}.svg`, logoSrc(b,l).svg); }));
  $('#main').querySelectorAll('[data-act="copypng"]').forEach(el=>
    el.addEventListener('click',()=>{ const l=b.logos[+el.dataset.i], s=logoSrc(b,l);
      if(s.svg) copyPng(s.svg, {fg:l.fg||null, maxDim:1536}, 'PNG copied');
      else copyPngBytes(dataUriToBytes(s.png),'PNG copied'); }));
  $('#main').querySelectorAll('[data-act="dlpng"]').forEach(el=>
    el.addEventListener('click',async()=>{ const l=b.logos[+el.dataset.i], s=logoSrc(b,l);
      try{
        const blob = s.svg ? await svgToPngBlob(s.svg,{fg:l.fg||null, maxDim:1536}) : new Blob([dataUriToBytes(s.png)],{type:'image/png'});
        dlBlob(`${b.id}-${slug(l.label)}.png`, blob); toast('PNG downloaded');
      }catch(e){ toast('PNG export failed'); } }));
  /* asset files — serve the original bytes straight back */
  const fileAt = el => packs[+el.dataset.p].files[+el.dataset.i];
  $('#main').querySelectorAll('[data-act="fdlsvg"]').forEach(el=>
    el.addEventListener('click',()=>{ const f=fileAt(el);
      dl(`${f.name}.svg`, f.svg); toast(`${f.name}.svg downloaded`); }));
  $('#main').querySelectorAll('[data-act="fdlpng"]').forEach(el=>
    el.addEventListener('click',()=>{ const f=fileAt(el);
      dlBlob(`${f.name}.png`, new Blob([dataUriToBytes(f.png)],{type:'image/png'}));
      toast(`${f.name}.png downloaded`); }));
  $('#main').querySelectorAll('[data-act="fcopysvg"]').forEach(el=>
    el.addEventListener('click',()=>copy(fileAt(el).svg,'SVG markup copied')));
  $('#main').querySelectorAll('[data-act="fcopypng"]').forEach(el=>
    el.addEventListener('click',()=>copyPngBytes(dataUriToBytes(fileAt(el).png),'PNG copied')));
  $('#main').querySelectorAll('[data-act="zipall"]').forEach(zipBtn=>
    zipBtn.addEventListener('click',()=>{
      const p = packs[+zipBtn.dataset.p];
      try{
        const all = p.files.flatMap(assetBlobs);
        dlBlob(p.zipName || `${b.id}-${slug(p.title)}.zip`, zipBlob(all));
        toast(`${all.length} files downloaded`);
      }catch(e){ toast('ZIP export failed'); }
    }));

  $('#main').querySelector('[data-act="csscopy"]').addEventListener('click',()=>copy(cssVars(b),'CSS variables copied'));
  $('#main').querySelector('[data-act="jsoncopy"]').addEventListener('click',()=>copy(tokensJson(b),'JSON tokens copied'));
  $('#main').querySelector('[data-act="mdcopy"]').addEventListener('click',()=>copy(brandMarkdown(b),'Markdown copied'));
  $('#main').querySelector('[data-act="mddl"]').addEventListener('click',()=>dl(`${b.id}-brand.md`, brandMarkdown(b), 'text/markdown'));

  /* icons */
  $('#main').querySelectorAll('[data-act="copyicon"]').forEach(el=>
    el.addEventListener('click',()=>{ const ic=b.icons[+el.dataset.i]; copy(ic.svg, `${ic.name} SVG copied`); }));
  $('#main').querySelectorAll('[data-act="dlicon"]').forEach(el=>
    el.addEventListener('click',()=>{ const ic=b.icons[+el.dataset.i]; dl(`${b.id}-icon-${slug(ic.name)}.svg`, ic.svg); }));
  $('#main').querySelectorAll('[data-act="dliconpng"]').forEach(el=>
    el.addEventListener('click',async()=>{ const ic=b.icons[+el.dataset.i];
      try{ dlBlob(`${b.id}-icon-${slug(ic.name)}.png`, await svgToPngBlob(ic.svg,{maxDim:512})); toast('PNG downloaded'); }
      catch(e){ toast('PNG export failed'); } }));
  const iconSearch=$('#iconSearch');
  if(iconSearch){
    iconSearch.addEventListener('input',()=>{
      const q=iconSearch.value.trim().toLowerCase();
      let shown=0;
      $('#iconGrid').querySelectorAll('.icon-card').forEach(c=>{
        const match = !q || c.dataset.search.includes(q);
        c.hidden = !match; if(match) shown++;
      });
      $('#iconNone').hidden = shown>0;
    });
  }
}

/* ---------- routing ---------- */
function firstActive(){ return BRANDS.find(x=>!x.comingSoon) || BRANDS[0]; }
function route(){
  const id = location.hash.replace('#','');
  let b = BRANDS.find(x=>x.id===id);
  if(!b || b.comingSoon) b = firstActive();
  current = b.id;
  brandView = 'current';
  renderSidebar();
  renderBrand(b);
  window.scrollTo({top:0, behavior:'instant'});
  const main = $('#main');
  main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter');
}
/* ---------- login gate (client-side) ---------- */
const AUTH_USER='user', AUTH_PASS='T1ugo#Br4nd!26', AUTH_KEY='tbb-auth-v2';
function isAuthed(){ try{ return sessionStorage.getItem(AUTH_KEY)==='1'; }catch(e){ return false; } }
function startApp(){
  window.addEventListener('hashchange', route);
  route();
}
function showGate(){
  const gate=$('#gate'), form=$('#gateForm'), err=$('#gateErr'), user=$('#gateUser'), pass=$('#gatePass');
  gate.hidden=false;
  setTimeout(()=>user.focus(),60);
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(user.value.trim()===AUTH_USER && pass.value===AUTH_PASS){
      try{ sessionStorage.setItem(AUTH_KEY,'1'); }catch(e){}
      gate.hidden=true;
      startApp();
    } else {
      err.hidden=false;
      form.classList.remove('gate-shake'); void form.offsetWidth; form.classList.add('gate-shake');
      pass.value=''; pass.focus();
    }
  });
}
if(isAuthed()) startApp(); else showGate();
</script>
</body>
</html>
