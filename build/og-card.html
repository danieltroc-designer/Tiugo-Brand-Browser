<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Source for assets/og-image.png (1200x630 social card).
  Regenerate with:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --default-background-color=00000000 \
      --screenshot="assets/og-image.png" "build/og-card.html"
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(1200px 520px at 88% -8%, rgba(255,90,0,.08), transparent 60%),
      radial-gradient(900px 520px at 108% 120%, rgba(174,172,149,.12), transparent 55%),
      #FAFAF8;
    color:#16161A;
    padding:74px 80px;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;overflow:hidden;
  }
  .accentbar{position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,#FF5A00,#121212,#7F00FD,#002FE6,#FFCF3E)}
  .top{display:flex;align-items:center;gap:20px}
  .mark{width:64px;height:64px}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.16em;
    text-transform:uppercase;color:#8E8E96}
  .mid h1{font-family:'Archivo',sans-serif;font-weight:700;font-size:104px;
    letter-spacing:-.03em;line-height:.98}
  .mid p{font-size:26px;color:#5B5B63;margin-top:22px;max-width:30ch;line-height:1.4}
  .strip{display:flex;gap:30px;align-items:flex-end}
  .brand{display:flex;flex-direction:column;gap:11px}
  .dot{width:44px;height:44px;border-radius:13px;position:relative;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.10)}
  .dot::before,.dot::after{content:"";position:absolute;inset:0}
  .dot::after{clip-path:polygon(100% 0,100% 100%,0 100%)}
  .brand .nm{font-family:'JetBrains Mono',monospace;font-size:14.5px;
    letter-spacing:.03em;color:#5B5B63}
</style>
</head>
<body>
  <div class="accentbar"></div>
  <div class="top">
    <svg class="mark" viewBox="0 0 367 367" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="367" height="367" fill="#FF5A00"/>
<path d="M92 106.995H166.599V274.178H180.217V295H182.109H216.987V259.968V258.068H201.439V106.995H276V72H92V106.995Z" fill="white"/>
</svg>
    <span class="kicker">Tiugo Technologies</span>
  </div>

  <div class="mid">
    <h1>Brand Browser</h1>
    <p>Logos, colors &amp; type for the Tiugo family of brands.</p>
  </div>

  <div class="strip">
    <div class="brand"><span class="dot" style="--c1:#FF5A00;--c2:#121212"></span><span class="nm">Tiugo</span></div>
    <div class="brand"><span class="dot" style="--c1:#7F00FD;--c2:#B0EB1D"></span><span class="nm">CKEditor</span></div>
    <div class="brand"><span class="dot" style="--c1:#002FE6;--c2:#00BC84"></span><span class="nm">Tiny</span></div>
    <div class="brand"><span class="dot" style="--c1:#0505E5;--c2:#FBE700"></span><span class="nm">ButterCMS</span></div>
    <div class="brand"><span class="dot" style="--c1:#FFCF3E;--c2:#002FFF"></span><span class="nm">Uploadcare</span></div>
  </div>
  <style>.dot::before{background:var(--c1)}.dot::after{background:var(--c2)}</style>
</body>
</html>
