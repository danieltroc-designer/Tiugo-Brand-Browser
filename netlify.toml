# Static deploy: index.html is prebuilt at the repo root, no build step at deploy time.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
