<style>
:root{
  --ink:#16161A; --ink-2:#5B5B63; --ink-3:#8E8E96;
  --paper:#FAFAF8; --card:#FFFFFF; --line:#E7E6E1;
  --accent:#3A63AF; --accent-2:#2AA27B; --on-accent:#FFFFFF;
  --mono:'JetBrains Mono',monospace; --disp:'Archivo',sans-serif; --body:'Inter',sans-serif;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.theme-dark{--ink:#F4F4F2;--ink-2:#A7A7A7;--ink-3:#6F6F6F;--paper:#090909;--card:#111111;--line:#242424}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.side{border-right:1px solid var(--line);padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;background:var(--paper);transition:background .35s,border-color .35s}
.masthead .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.masthead h1{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.15;margin-top:6px}
.brand-list{display:flex;flex-direction:column;gap:6px}
.brand-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);text-align:left;border:1px solid transparent;transition:background .18s,border-color .18s;width:100%}
.brand-btn:hover{background:var(--card);border-color:var(--line)}
.brand-btn.active{background:var(--card);border-color:var(--line);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.brand-btn .dot{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;position:relative;overflow:hidden}
.brand-btn .dot::before,.brand-btn .dot::after{content:"";position:absolute;inset:0}
.brand-btn .dot::before{background:var(--c1)}
.brand-btn .dot::after{background:var(--c2);clip-path:polygon(100% 0,100% 100%,0 100%)}
.brand-btn .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.brand-btn .dm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.brand-btn.soon{opacity:.5;cursor:not-allowed}
.brand-btn.soon:hover{background:transparent;border-color:transparent;box-shadow:none}
.brand-btn .soon-badge{margin-left:auto;flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.side-foot a{color:var(--ink-2)}

/* ---------- main ---------- */
main{padding:0 clamp(24px,5vw,72px) 96px;max-width:1180px}
.hero{padding:64px 0 34px;border-bottom:1px solid var(--line);margin-bottom:40px}
.hero .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:10px}
.hero .crumb .bar{display:inline-block;width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.hero h2{font-family:var(--disp);font-weight:700;font-size:clamp(34px,5vw,52px);letter-spacing:-.02em;line-height:1.04;margin:14px 0 10px}
.hero p{color:var(--ink-2);max-width:56ch}
.hero .meta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--card)}
.chip .sw{width:9px;height:9px;border-radius:3px;background:var(--accent)}
a.chip{text-decoration:none}
a.chip:hover{border-color:var(--accent)}

/* brand versions (Current / New) */
.notice{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:22px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 13%,transparent);border-radius:10px;font-size:12.5px;line-height:1.45;color:var(--ink)}
.notice .ni{flex:none;width:16px;height:16px;color:var(--accent)}
.verbar{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:22px;background:var(--card)}
.verbar button{padding:8px 20px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-2);transition:background .15s,color .15s}
.verbar button.on{background:var(--accent);color:var(--on-accent)}
.soon-panel{border:1px dashed var(--line);border-radius:var(--r);background:var(--card);padding:64px 30px;text-align:center}
.soon-panel .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:5px 13px;margin-bottom:18px}
.soon-panel h3{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:-.01em;margin-bottom:10px}
.soon-panel p{color:var(--ink-2);font-size:14px;max-width:46ch;margin:0 auto;line-height:1.6}

section{margin-bottom:56px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h3{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.01em}
.sec-h .hint{font-size:12.5px;color:var(--ink-3)}
.sec-actions{display:flex;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:13px;height:13px}

/* logos */
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.logo-card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.logo-stage{display:grid;place-items:center;min-height:170px;padding:34px}
.logo-stage.light{background:#fff}
.logo-stage.dark{background:#0B0B0B}
.logo-stage svg,.logo-stage img{max-width:min(240px,80%);max-height:96px;width:auto;height:auto}
.logo-meta{padding:14px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;flex:1}
.logo-meta .lbl{font-weight:600;font-size:13.5px}
.logo-meta .nt{font-size:12px;color:var(--ink-2);line-height:1.5;flex:1}
.logo-meta .row{display:flex;gap:8px;flex-wrap:wrap}
.ftags{display:flex;gap:6px;flex-wrap:wrap}
.ftag{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:3px 7px;white-space:nowrap}

/* icons */
.icon-search{width:100%;max-width:340px;margin-bottom:14px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.icon-search::placeholder{color:var(--ink-3)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.icon-card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px 10px 11px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;transition:border-color .15s,box-shadow .12s}
.icon-card:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(0,0,0,.06)}
.icon-tile{display:grid;place-items:center;height:54px;width:100%;color:var(--ink)}
.icon-tile svg,.icon-tile img{width:auto;height:auto;max-width:34px;max-height:34px}
.icon-cap{font-size:11.5px;color:var(--ink-2);line-height:1.25;word-break:break-word;min-height:1.25em}
.icon-acts{display:flex;gap:6px}
.ibtn{padding:4px 10px;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--paper);transition:border-color .15s,color .15s}
.ibtn:hover{border-color:var(--accent);color:var(--ink)}
.icon-none{font-size:13px;color:var(--ink-3);margin-top:14px}
.icon-empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 20px}
.icon-empty .t{font-size:13.5px;font-weight:600}
.icon-empty .h{color:var(--ink-2);margin-top:8px;font-size:12.5px;line-height:1.65;max-width:70ch}
.icon-empty code{font-family:var(--mono);font-size:11.5px;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:1px 5px;border-radius:4px}

/* colors */
.cgroup{margin-bottom:22px}
.cgroup .gname{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.swatch{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);text-align:left;transition:transform .12s,box-shadow .12s;position:relative}
.swatch:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.swatch .fill{display:block;height:64px;position:relative}
.swatch .fill .cp{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:5px;opacity:0;transition:opacity .15s}
.swatch:hover .fill .cp{opacity:1}
.swatch .info{display:block;padding:9px 11px}
.swatch .cn{font-size:12.5px;font-weight:600;line-height:1.25}
.swatch .cv{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:2px}
.fmt-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fmt-toggle button{padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.fmt-toggle button.on{background:var(--accent);color:var(--on-accent)}

/* typography */
.font-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:22px}
.font-card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px}
.font-card .fam{font-size:26px;line-height:1.2}
.font-card .frole{font-size:12px;color:var(--ink-2);margin-top:6px}
.font-card .fsrc{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:10px}
.type-table{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.trow{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .spec{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .props{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-align:right;line-height:1.7;flex:none}
.trow .props b{color:var(--ink-2);font-weight:500}

/* guidelines */
.rules{display:grid;gap:10px}
.rule{display:flex;gap:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.rule .tick{flex:none;width:19px;height:19px;border-radius:6px;background:color-mix(in srgb,var(--accent) 14%,transparent);display:grid;place-items:center;margin-top:1px}
.rule .tick::after{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent)}

/* export */
.export-box{border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.export-box p{font-size:12.5px;color:var(--ink-2);margin-right:auto}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:82vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* login gate */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--paper)}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:344px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:30px 28px;box-shadow:0 12px 44px rgba(0,0,0,.08)}
.gate-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.gate-card h1{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:-.01em;line-height:1.1}
.gate-sub{font-size:13px;color:var(--ink-2);margin-top:-8px;line-height:1.5}
.gate-field{display:flex;flex-direction:column;gap:6px}
.gate-field span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.gate-field input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px}
.gate-err{font-size:12.5px;color:#C0392B;margin-top:-4px}
.gate-btn{margin-top:4px;padding:11px 14px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;transition:opacity .15s}
.gate-btn:hover{opacity:.9}
.gate-shake{animation:gate-shake .4s}
@keyframes gate-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

@media (max-width:840px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;padding:20px}
  .brand-list{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .brand-btn{flex:none}
  .brand-btn .dm{display:none}
  .side-foot{display:none}

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const rgbStr = h => { const [r,g,b]=hexToRgb(h); return `rgb(${r}, ${g}, ${b})`; };
const isLight = h => { const [r,g,b]=hexToRgb(h); return (r*299+g*587+b*114)/1000 > 150; };
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
async function copy(text,msg){ try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(msg||'Copied'); }
function dl(name, content, type='image/svg+xml'){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); }
function dlBlob(name, blob){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000); }
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ---- SVG → PNG (transparent background, high-res) ---- */
/* Inject explicit size (from viewBox) + color so currentColor renders when rasterized. */
function pngSource(svg, fg){
  let attrs='';
  if(!/<svg[^>]*\swidth=/.test(svg)){
    const vb=svg.match(/viewBox="([^"]+)"/);
    if(vb){ const p=vb[1].trim().split(/[\s,]+/).map(Number);
      if(p.length===4) attrs+=` width="${p[2]}" height="${p[3]}"`; }
  }
  if(fg) attrs+=` color="${fg}"`;
  return attrs ? svg.replace('<svg', '<svg'+attrs) : svg;
}
function svgDims(svg){
  const vb=svg.match(/viewBox="([^"]+)"/);
  if(vb){ const p=vb[1].trim().split(/[\s,]+/).map(Number); if(p.length===4) return [p[2],p[3]]; }
  const w=svg.match(/\bwidth="([\d.]+)"/), h=svg.match(/\bheight="([\d.]+)"/);
  return [w?+w[1]:512, h?+h[1]:512];
}
/* Rasterize so the longest side is ~maxDim px. Transparent unless bg given. */
function svgToPngBlob(svg, {fg=null, maxDim=1024, bg=null}={}){
  return new Promise((resolve,reject)=>{
    const [vw,vh]=svgDims(svg);
    const s=maxDim/Math.max(vw,vh);
    const w=Math.max(1,Math.round(vw*s)), h=Math.max(1,Math.round(vh*s));
    const src=pngSource(svg, fg);
    const url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml;charset=utf-8'}));
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d');
      if(bg){ ctx.fillStyle=bg; ctx.fillRect(0,0,w,h); }
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b?resolve(b):reject(new Error('toBlob failed')), 'image/png');
    };
    img.onerror=e=>{ URL.revokeObjectURL(url); reject(e); };
    img.src=url;
  });
}
async function copyPng(svg, opts, msg){
  try{
    const blob=await svgToPngBlob(svg,opts);
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast(msg||'PNG copied');
    } else { dlBlob((opts&&opts.name)||'logo.png', blob); toast('PNG downloaded'); }
  }catch(e){ toast('PNG copy unavailable — downloading'); 
    try{ dlBlob((opts&&opts.name)||'logo.png', await svgToPngBlob(svg,opts)); }catch(_){}}
}

/* ---- original asset files (embedded byte-for-byte) ---- */
const TXT = new TextEncoder();
function dataUriToBytes(uri){
  const bin=atob(uri.slice(uri.indexOf(',')+1));
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
const kb = n => n<1024 ? `${n} B` : `${(n/1024).toFixed(n<10240?1:0)} KB`;
/* Every file an asset entry can hand over, as {name, bytes}. */
function assetBlobs(f){
  const out=[];
  if(f.svg) out.push({name:`${f.name}.svg`, bytes:TXT.encode(f.svg), type:'image/svg+xml'});
  if(f.png) out.push({name:`${f.name}.png`, bytes:dataUriToBytes(f.png), type:'image/png'});
  return out;
}
async function copyPngBytes(bytes, msg){
  const blob=new Blob([bytes],{type:'image/png'});
  try{
    if(!(navigator.clipboard && window.ClipboardItem)) throw new Error('unsupported');
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    toast(msg||'PNG copied');
  }catch(e){ toast('PNG copy unavailable — downloading'); dlBlob('asset.png', blob); }
}

/* ---- minimal store-only .zip writer (no compression, no dependencies) ---- */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t; })();
function crc32(bytes){ let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function zipBlob(files){
  const local=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name=TXT.encode(f.name), data=f.bytes, crc=crc32(data), len=data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true);
    lh.setUint16(8,0,true);   /* method 0 = stored */
    lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,len,true); lh.setUint32(22,len,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    local.push(new Uint8Array(lh.buffer), name, data);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true);
    cd.setUint16(8,0,true); cd.setUint16(10,0,true); cd.setUint16(12,0,true); cd.setUint16(14,0,true);
    cd.setUint32(16,crc,true); cd.setUint32(20,len,true); cd.setUint32(24,len,true);
    cd.setUint16(28,name.length,true); cd.setUint16(30,0,true); cd.setUint16(32,0,true);
    cd.setUint16(34,0,true); cd.setUint16(36,0,true); cd.setUint32(38,0,true);
    cd.setUint32(42,offset,true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + len;
  });
  const cdSize=central.reduce((n,c)=>n+c.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,offset,true); eo.setUint16(20,0,true);
  return new Blob([...local,...central,new Uint8Array(eo.buffer)],{type:'application/zip'});
}

function swatch(c){
  const v = fmt==='hex' ? c.hex.toUpperCase() : rgbStr(c.hex);
  const tag = isLight(c.hex) ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.75)';
  const tagBg = isLight(c.hex) ? 'rgba(255,255,255,.6)' : 'rgba(0,0,0,.35)';
  const border = c.hex.toUpperCase()==='#FFFFFF' ? 'box-shadow:inset 0 0 0 1px var(--line);' : '';
  return `<button class="swatch" data-copy="${v}" title="Copy ${v}">
    <span class="fill" style="background:${c.hex};${border}"><span class="cp" style="color:${tag};background:${tagBg}">COPY</span></span>
    <span class="info"><span class="cn">${esc(c.name)}</span><br><span class="cv">${v}</span></span>
  </button>`;
}

function cssVars(b){
  const lines=[`/* ${b.name} — brand tokens */`,`:root{`];
  b.colorGroups.forEach(g=>g.colors.forEach(c=>
    lines.push(`  --${slug(b.id)}-${slug(g.group)}-${slug(c.name)}: ${c.hex.toUpperCase()};`)));
  b.fonts.forEach((f,i)=>lines.push(`  --${slug(b.id)}-font-${i?'secondary':'primary'}: ${f.css};`));
  lines.push('}');
  return lines.join('\n');
}

function brandMarkdown(b){
  const L=[];
  L.push(`# ${b.name}`, '');
  if(b.tagline) L.push(`> ${b.tagline}`, '');
  L.push(`- **Website:** https://${b.domain}`);
  L.push(`- **Accent:** \`${b.accent.toUpperCase()}\` / \`${b.accent2.toUpperCase()}\``);
  L.push(`- **Typefaces:** ${b.fonts.map(f=>f.family).join(', ')}`, '');

  L.push('## Colors', '');
  b.colorGroups.forEach(g=>{
    L.push(`### ${g.group}`, '', '| Name | HEX | RGB |', '| --- | --- | --- |');
    g.colors.forEach(c=>L.push(`| ${c.name} | \`${c.hex.toUpperCase()}\` | \`${rgbStr(c.hex)}\` |`));
    L.push('');
  });

  L.push('## Typography', '', '### Typefaces', '');
  b.fonts.forEach(f=>L.push(`- **${f.family}** — ${f.role} (${f.source})`));
  L.push('', '### Type scale', '',
    '| Style | Family | Weight | Size | Line height | Letter spacing |',
    '| --- | --- | --- | --- | --- | --- |');
  b.typeStyles.forEach(t=>L.push(`| ${t.name} | ${t.family} | ${t.weight} | ${t.size}px | ${t.lh} | ${t.ls&&t.ls!=='0'?t.ls:'—'} |`));
  L.push('');

  if(b.logos&&b.logos.length){
    L.push('## Logos', '');
    b.logos.forEach(l=>L.push(`- **${l.label}**${l.note?` — ${l.note}`:''} _(stage: ${l.bg})_`));
    L.push('');
  }
  if(b.icons&&b.icons.length){
    L.push('## Icons', '', `${b.icons.length} icons available. Names:`, '',
      b.icons.map(ic=>`\`${ic.name}\``).join(', '), '');
  }
  if(b.guidelines&&b.guidelines.length){
    L.push('## Usage guidelines', '');
    b.guidelines.forEach(r=>L.push(`- ${r}`));
    L.push('');
  }
  L.push('---', '_Exported from the Tiugo Brand Browser._');
  return L.join('\n');
}

function renderBrand(base){
  const hasVersions = !!base.versions;
  if(!hasVersions) brandView = 'current';
  const view = brandView;
  /* merge the active variant over the base brand so Current/New each render a full sheet */
  const b = (base.variants && base.variants[view]) ? {...base, ...base.variants[view]} : base;

  document.body.style.setProperty('--accent', b.accent);
  document.body.style.setProperty('--accent-2', b.accent2);
  document.body.style.setProperty('--on-accent', isLight(b.accent)?'#111':'#fff');
  document.body.classList.toggle('theme-dark', !!b.dark);

  const disclaimer = (hasVersions && view==='current' && b.currentNotice)
    ? `<div class="notice"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg><span>${esc(b.currentNotice)}</span></div>`
    : '';
  const versionBar = hasVersions
    ? `<div class="verbar" role="group" aria-label="Brand version">
        <button data-ver="current" class="${view==='current'?'on':''}" aria-pressed="${view==='current'}">Current</button>
        <button data-ver="new" class="${view==='new'?'on':''}" aria-pressed="${view==='new'}">New</button>
      </div>`
    : '';

  const heroHtml = `
  <div class="hero">
    ${disclaimer}
    <span class="crumb"><span class="bar"></span>Brand ${String(BRANDS.indexOf(base)+1).padStart(2,'0')} / ${String(BRANDS.length).padStart(2,'0')}</span>
    <h2>${esc(b.name)}</h2>
    <p>${esc(b.tagline)}</p>
    <div class="meta">
      <a class="chip" href="https://${b.domain}" target="_blank" rel="noopener">${b.domain} ↗</a>
      <span class="chip"><span class="sw"></span>${b.accent.toUpperCase()}</span>
      <span class="chip">${esc(b.fonts.map(f=>f.family).join(' + '))}</span>
    </div>
    ${versionBar}
  </div>`;

  const sectionsHtml = `
  <section id="logo">
    <div class="sec-h"><h3>Logo</h3><span class="hint">Copy the raw SVG markup or download the file</span></div>
    <div class="logo-grid">${b.logos.map((l,i)=>logoCard(b,l,i)).join('')}</div>
  </section>

  ${(b.assetFiles&&b.assetFiles.length)?`
  <section id="files">
    <div class="sec-h">
      <h3>Asset files</h3>
      <span class="hint">Original exports — you get the exact file, not a re-render</span>
      <div class="sec-actions">
        <button class="btn primary" data-act="zipall">${DL_ICON}Download all (${b.assetFiles.reduce((n,f)=>n+(f.svg?1:0)+(f.png?1:0),0)} files)</button>
      </div>
    </div>
    <div class="logo-grid">${b.assetFiles.map((f,i)=>assetCard(f,i)).join('')}</div>
  </section>`:''}

  <section id="icons">
    <div class="sec-h"><h3>Icons</h3><span class="hint">Copy or download any glyph as SVG</span></div>
    ${(b.icons&&b.icons.length)?`
      <input type="search" class="icon-search" id="iconSearch" placeholder="Search ${b.icons.length} icon${b.icons.length===1?'':'s'}…" aria-label="Search icons" autocomplete="off">
      <div class="icon-grid" id="iconGrid">${b.icons.map((ic,i)=>iconCard(ic,i)).join('')}</div>
      <p class="icon-none" id="iconNone" hidden>No icons match your search.</p>`
    :`
      <div class="icon-empty">
        <p class="t">No icons in the ${esc(b.name)} library yet.</p>
        <p class="h">Add them to <code>build/brands.json</code> under this brand's <code>icons</code> array — each entry is <code>{ "name", "keywords", "svg" }</code> — then run <code>python3 build/build.py</code>. They'll show up here with per-icon copy &amp; download and live search.</p>
      </div>`}
  </section>

  <section id="colors">
    <div class="sec-h">
      <h3>Colors</h3>
      <div class="sec-actions">
        <span class="fmt-toggle" role="group" aria-label="Color format">
          <button data-fmt="hex" class="${fmt==='hex'?'on':''}">HEX</button>
          <button data-fmt="rgb" class="${fmt==='rgb'?'on':''}">RGB</button>
        </span>
      </div>
    </div>
    ${b.colorGroups.map(g=>`
      <div class="cgroup">
        <div class="gname">${esc(g.group)}</div>
        <div class="swatches">${g.colors.map(swatch).join('')}</div>
      </div>`).join('')}
  </section>

  <section id="type">
    <div class="sec-h"><h3>Typography</h3><span class="hint">Live specimens set in the real typefaces</span></div>
    <div class="font-cards">
      ${b.fonts.map(f=>`<div class="font-card">
        <div class="fam" style="font-family:${f.css}">${esc(f.family)}</div>
        <div class="frole">${esc(f.role)}</div>
        <div class="fsrc">${esc(f.source)}</div>
      </div>`).join('')}
    </div>
    <div class="type-table">
      ${b.typeStyles.map(t=>{
        const px=Math.min(t.size,40);
        const w=parseInt(t.weight);
        return `<div class="trow">
          <div class="spec" style="font-family:${b.fonts.find(f=>f.family===t.family)?.css||t.family};font-weight:${w};font-size:${px}px;line-height:1.25;${t.upper?'text-transform:uppercase;':''}${t.ls&&t.ls!=='0'?`letter-spacing:${t.ls};`:''}">${esc(t.name)}</div>
          <div class="props"><b>${esc(t.family)} · ${esc(t.weight)}</b><br>${t.size}px / ${esc(String(t.lh))}${t.ls&&t.ls!=='0'?` · ls ${esc(t.ls)}`:''}</div>
        </div>`;}).join('')}
    </div>
  </section>

  ${b.guidelines?.length?`
  <section id="rules">
    <div class="sec-h"><h3>Usage guidelines</h3></div>
    <div class="rules">${b.guidelines.map(r=>`<div class="rule"><span class="tick" aria-hidden="true"></span><span>${esc(r)}</span></div>`).join('')}</div>
  </section>`:''}

  <section id="export">
    <div class="sec-h"><h3>Export tokens</h3></div>
    <div class="export-box">
      <p>Take the whole palette and type system with you.</p>
      <button class="btn primary" data-act="mdcopy">Copy Markdown</button>
      <button class="btn" data-act="mddl">Download .md</button>
      <button class="btn" data-act="csscopy">Copy CSS variables</button>
      <button class="btn" data-act="jsoncopy">Copy JSON</button>
    </div>
  </section>`;

  $('#main').innerHTML = heroHtml + sectionsHtml;

  /* version toggle */
  $('#main').querySelectorAll('[data-ver]').forEach(el=>
    el.addEventListener('click',()=>{ brandView=el.dataset.ver; renderBrand(base); window.scrollTo({top:0}); }));

  /* wire events */
  $('#main').querySelectorAll('[data-copy]').forEach(el=>
    el.addEventListener('click',()=>copy(el.dataset.copy, `${el.dataset.copy} copied`)));
  $('#main').querySelectorAll('[data-fmt]').forEach(el=>
    el.addEventListener('click',()=>{ fmt=el.dataset.fmt; renderBrand(b); }));
  $('#main').querySelectorAll('[data-act="copysvg"]').forEach(el=>
    el.addEventListener('click',()=>copy(b.logos[+el.dataset.i].svg,'SVG markup copied')));
  $('#main').querySelectorAll('[data-act="dlsvg"]').forEach(el=>
    el.addEventListener('click',()=>{ const l=b.logos[+el.dataset.i];
      dl(`${b.id}-${slug(l.label)}.svg`, l.svg); }));
  $('#main').querySelectorAll('[data-act="copypng"]').forEach(el=>
    el.addEventListener('click',()=>{ const l=b.logos[+el.dataset.i];
      copyPng(l.svg, {fg:l.fg||null, maxDim:1536}, 'PNG copied'); }));
  $('#main').querySelectorAll('[data-act="dlpng"]').forEach(el=>
    el.addEventListener('click',async()=>{ const l=b.logos[+el.dataset.i];
      try{ dlBlob(`${b.id}-${slug(l.label)}.png`, await svgToPngBlob(l.svg,{fg:l.fg||null, maxDim:1536})); toast('PNG downloaded'); }
      catch(e){ toast('PNG export failed'); } }));
  /* asset files — serve the original bytes straight back */
  const files = b.assetFiles || [];
  $('#main').querySelectorAll('[data-act="fdlsvg"]').forEach(el=>
    el.addEventListener('click',()=>{ const f=files[+el.dataset.i];
      dl(`${f.name}.svg`, f.svg); toast(`${f.name}.svg downloaded`); }));
  $('#main').querySelectorAll('[data-act="fdlpng"]').forEach(el=>
    el.addEventListener('click',()=>{ const f=files[+el.dataset.i];
      dlBlob(`${f.name}.png`, new Blob([dataUriToBytes(f.png)],{type:'image/png'}));
      toast(`${f.name}.png downloaded`); }));
  $('#main').querySelectorAll('[data-act="fcopysvg"]').forEach(el=>
    el.addEventListener('click',()=>copy(files[+el.dataset.i].svg,'SVG markup copied')));
  $('#main').querySelectorAll('[data-act="fcopypng"]').forEach(el=>
    el.addEventListener('click',()=>copyPngBytes(dataUriToBytes(files[+el.dataset.i].png),'PNG copied')));
  const zipBtn = $('#main').querySelector('[data-act="zipall"]');
  if(zipBtn) zipBtn.addEventListener('click',()=>{
    try{
      const all = files.flatMap(assetBlobs);
      dlBlob(`${b.id}-${brandView}-logos.zip`, zipBlob(all));
      toast(`${all.length} files downloaded`);
    }catch(e){ toast('ZIP export failed'); }
  });

  $('#main').querySelector('[data-act="csscopy"]').addEventListener('click',()=>copy(cssVars(b),'CSS variables copied'));
  $('#main').querySelector('[data-act="jsoncopy"]').addEventListener('click',()=>copy(tokensJson(b),'JSON tokens copied'));
  $('#main').querySelector('[data-act="mdcopy"]').addEventListener('click',()=>copy(brandMarkdown(b),'Markdown copied'));
  $('#main').querySelector('[data-act="mddl"]').addEventListener('click',()=>dl(`${b.id}-brand.md`, brandMarkdown(b), 'text/markdown'));

  /* icons */
  $('#main').querySelectorAll('[data-act="copyicon"]').forEach(el=>
    el.addEventListener('click',()=>{ const ic=b.icons[+el.dataset.i]; copy(ic.svg, `${ic.name} SVG copied`); }));
  $('#main').querySelectorAll('[data-act="dlicon"]').forEach(el=>
    el.addEventListener('click',()=>{ const ic=b.icons[+el.dataset.i]; dl(`${b.id}-icon-${slug(ic.name)}.svg`, ic.svg); }));
  $('#main').querySelectorAll('[data-act="dliconpng"]').forEach(el=>
    el.addEventListener('click',async()=>{ const ic=b.icons[+el.dataset.i];
      try{ dlBlob(`${b.id}-icon-${slug(ic.name)}.png`, await svgToPngBlob(ic.svg,{maxDim:512})); toast('PNG downloaded'); }
      catch(e){ toast('PNG export failed'); } }));
  const iconSearch=$('#iconSearch');
  if(iconSearch){
    iconSearch.addEventListener('input',()=>{
      const q=iconSearch.value.trim().toLowerCase();
      let shown=0;
      $('#iconGrid').querySelectorAll('.icon-card').forEach(c=>{
        const match = !q || c.dataset.search.includes(q);
        c.hidden = !match; if(match) shown++;
      });
      $('#iconNone').hidden = shown>0;
    });
  }
}

/* ---------- routing ---------- */
function firstActive(){ return BRANDS.find(x=>!x.comingSoon) || BRANDS[0]; }
function route(){
  const id = location.hash.replace('#','');
  let b = BRANDS.find(x=>x.id===id);
  if(!b || b.comingSoon) b = firstActive();
  current = b.id;
  brandView = 'current';
  renderSidebar();
  renderBrand(b);
  window.scrollTo({top:0});
}
/* ---------- login gate (client-side) ---------- */
const AUTH_USER='user', AUTH_PASS='T1ugo#Br4nd!26', AUTH_KEY='tbb-auth-v2';
function isAuthed(){ try{ return sessionStorage.getItem(AUTH_KEY)==='1'; }catch(e){ return false; } }
function startApp(){
  window.addEventListener('hashchange', route);
  route();
}
function showGate(){
  const gate=$('#gate'), form=$('#gateForm'), err=$('#gateErr'), user=$('#gateUser'), pass=$('#gatePass');
  gate.hidden=false;
  setTimeout(()=>user.focus(),60);
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(user.value.trim()===AUTH_USER && pass.value===AUTH_PASS){
      try{ sessionStorage.setItem(AUTH_KEY,'1'); }catch(e){}
      gate.hidden=true;
      startApp();
    } else {
      err.hidden=false;
      form.classList.remove('gate-shake'); void form.offsetWidth; form.classList.add('gate-shake');
      pass.value=''; pass.focus();
    }
  });
}
if(isAuthed()) startApp(); else showGate();
</script>
</body>
</html>
